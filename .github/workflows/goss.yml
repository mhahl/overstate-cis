# CI: render gate + full goss matrix (Fedora 44, Tumbleweed, Leap 16.0) x (L1, L2).
# Enforcement runs in privileged systemd containers. Live-kernel goss checks
# (getenforce, auditd active, firewall-cmd) skip via SKIP_KERNEL_CHECKS=1;
# file-content checks stay strict. scripts/ci/check-apply.py allowlists the
# handful of states that need a real kernel (documented there).
name: goss

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "salt>=3008,<3009" pyyaml
      - name: Render every SLS
        run: |
          # salt-call lives in the setup-python venv, which sudo's secure_path
          # cannot see — resolve it to an absolute path first.
          SALT_CALL="$(dirname "$(command -v python)")/salt-call"
          sudo mkdir -p /srv/salt
          sudo cp -r "$GITHUB_WORKSPACE" /srv/salt/overstate_cis
          for sls in init packages config services audit selinux bootloader \
                      network logging access accounts maintenance; do
            echo "--- overstate_cis.$sls"
            sudo "$SALT_CALL" --local state.show_sls "overstate_cis.$sls" --out=quiet
          done
      - name: Validate pillar.example and goss files parse
        run: |
          python3 -c "import yaml; yaml.safe_load(open('pillar.example'))"
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('tests/goss/*.yaml')]"

  goss:
    needs: render
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:44", "opensuse/tumbleweed:latest", "opensuse/leap:16.0"]
        level: [l1, l2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot privileged systemd container
        run: |
          docker run -d --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --name target "${{ matrix.image }}" /sbin/init
          for i in $(seq 1 30); do
            docker exec target systemctl is-system-running >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec target systemctl is-system-running || true

      - name: Install Salt and goss
        run: |
          if docker exec target test -x /usr/bin/zypper; then
            docker exec target zypper -n in salt-minion curl gzip
          else
            docker exec target dnf -y install salt-minion curl gzip
          fi
          docker exec target sh -c 'curl -fsSL -o /usr/local/bin/goss https://github.com/goss-org/goss/releases/latest/download/goss-linux-amd64 && chmod +x /usr/local/bin/goss'

      - name: Stage formula at /srv/salt/overstate_cis
        run: |
          docker exec target mkdir -p /srv/salt
          docker cp "$GITHUB_WORKSPACE/." target:/srv/salt/overstate_cis/
          docker exec target rm -rf /srv/salt/overstate_cis/.git

      - name: Render check in target OS
        run: docker exec target salt-call --local state.show_sls overstate_cis --out=quiet

      - name: Audit dry-run
        run: docker exec target salt-call --local state.apply overstate_cis.audit test=True

      - name: Enforce and gate apply
        run: |
          if [ "${{ matrix.level }}" = l2 ]; then
            PILLAR='{"overstate_cis": {"enforce": true, "level": 2, "tmout_enable": true, "umask_restrictive": true, "usb_disable": true, "audit_immutable": true}}'
          else
            PILLAR='{"overstate_cis": {"enforce": true, "level": 1}}'
          fi
          docker exec target salt-call --local state.apply overstate_cis "pillar=$PILLAR" --out=json > /tmp/apply.json || true
          python3 scripts/ci/check-apply.py /tmp/apply.json

      - name: Goss validate
        run: |
          docker cp "$GITHUB_WORKSPACE/tests/goss" target:/goss
          if [ "${{ matrix.level }}" = l2 ]; then ENABLE_L2=1; else ENABLE_L2=0; fi
          docker exec -e ENABLE_L2="$ENABLE_L2" -e SKIP_KERNEL_CHECKS=1 target goss -g /goss/ validate --format documentation
