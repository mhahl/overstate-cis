# CI: render gate + full goss matrix (Fedora 44, Tumbleweed, Leap 16.0) x (L1, L2).
# Enforcement runs in privileged systemd containers. Live-kernel goss checks
# (getenforce, auditd active, firewall-cmd) skip via SKIP_KERNEL_CHECKS=1;
# file-content checks stay strict. scripts/ci/check-apply.py allowlists the
# handful of states that need a real kernel (documented there).
name: goss

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "salt>=3008,<3009" pyyaml jinja2
      - name: Static lint (Jinja parse, YAML parse, duplicate keys)
        run: python3 scripts/ci/check-yaml.py
      - name: Render every SLS
        run: |
          # salt-call lives in the setup-python venv, which sudo's secure_path
          # cannot see — resolve it to an absolute path first.
          SALT_CALL="$(dirname "$(command -v python)")/salt-call"
          sudo mkdir -p /srv/salt
          sudo cp -r "$GITHUB_WORKSPACE" /srv/salt/overstate_cis
          for sls in init packages config services audit selinux bootloader \
                      network logging access accounts maintenance; do
            echo "--- overstate_cis.$sls"
            sudo "$SALT_CALL" --local state.show_sls "overstate_cis.$sls" --out=json > /dev/null
          done

  goss:
    needs: render
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:44", "opensuse/tumbleweed:latest", "opensuse/leap:16.0"]
        level: [l1, l2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep image with systemd, Salt and goss
        run: |
          # Base images ship no init binary — install systemd, then commit so the
          # boot step below has a real PID 1 to exec.
          CI_IMAGE="cis-ci-$(echo "${{ matrix.image }}" | tr '/:' '--')"
          echo "CI_IMAGE=$CI_IMAGE" >> "$GITHUB_ENV"
          docker run -d --name prep "${{ matrix.image }}" sleep infinity
          if docker exec prep test -x /usr/bin/zypper; then
            docker exec prep zypper -n in systemd salt-minion curl gzip
          else
            docker exec prep dnf -y install systemd salt-minion curl gzip
          fi
          # goss ships GoReleaser tarballs since v0.4.9 — pin version, extract binary.
          docker exec prep sh -c 'GOSS_VERSION=v0.4.10; curl -fsSL -o /tmp/goss.tar.gz "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss_${GOSS_VERSION#v}_linux_x86_64.tar.gz" && tar -xzf /tmp/goss.tar.gz -C /usr/local/bin goss && chmod +x /usr/local/bin/goss && rm /tmp/goss.tar.gz'
          docker commit prep "$CI_IMAGE"
          docker rm -f prep
          INIT=$(docker run --rm "$CI_IMAGE" sh -c 'for p in /sbin/init /usr/sbin/init /lib/systemd/systemd /usr/lib/systemd/systemd; do if test -x "$p"; then echo "$p"; break; fi; done')
          test -n "$INIT" || { echo "no init binary found in $CI_IMAGE"; exit 1; }
          echo "INIT=$INIT" >> "$GITHUB_ENV"

      - name: Boot privileged systemd container
        run: |
          docker run -d --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --name target "$CI_IMAGE" "$INIT"
          for i in $(seq 1 30); do
            docker exec target systemctl is-system-running >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec target systemctl is-system-running || true

      - name: Stage formula at /srv/salt/overstate_cis
        run: |
          docker exec target mkdir -p /srv/salt
          docker cp "$GITHUB_WORKSPACE/." target:/srv/salt/overstate_cis/
          docker exec target rm -rf /srv/salt/overstate_cis/.git

      - name: Render check in target OS
        run: docker exec target salt-call --local state.show_sls overstate_cis --out=json > /dev/null

      - name: Audit dry-run
        run: docker exec target salt-call --local state.apply overstate_cis.audit test=True

      - name: Enforce and gate apply
        run: |
          if [ "${{ matrix.level }}" = l2 ]; then
            PILLAR='{"overstate_cis": {"enforce": true, "level": 2, "tmout_enable": true, "umask_restrictive": true, "usb_disable": true, "audit_immutable": true}}'
          else
            PILLAR='{"overstate_cis": {"enforce": true, "level": 1}}'
          fi
          docker exec target salt-call --local state.apply overstate_cis "pillar=$PILLAR" --out=json > /tmp/apply.json || true
          python3 scripts/ci/check-apply.py /tmp/apply.json

      - name: Goss validate
        run: |
          docker cp "$GITHUB_WORKSPACE/tests/goss" target:/goss
          if [ "${{ matrix.level }}" = l2 ]; then ENABLE_L2=1; else ENABLE_L2=0; fi
          # goss -g takes one file; loop the per-section files so each reports.
          docker exec -e ENABLE_L2="$ENABLE_L2" -e SKIP_KERNEL_CHECKS=true target sh -c '
            fail=0
            for f in /goss/*.yaml; do
              echo "=== $f ==="
              goss -g "$f" validate --format documentation || fail=1
            done
            exit $fail
          '
