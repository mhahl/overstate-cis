file:
  /etc/selinux/config:
    exists: true
    contents:
      - 'SELINUX=enforcing'
      - 'SELINUXTYPE=targeted'
  /etc/default/grub:
    exists: true
    contents:
      - 'security=selinux'
      - 'selinux=1'
      - 'enforcing=1'
    # Skipped in containers: grub is absent so the state correctly skips.
    skip: {{ .Env.SKIP_KERNEL_CHECKS | default "false" }}
command:
  check-selinux-enforcing:
    exec: getenforce || sestatus
    exit-status: 0
    stdout:
      - enforcing
    # Live-kernel check: no SELinux in containers. File content above stays strict.
    skip: {{ .Env.SKIP_KERNEL_CHECKS | default "false" }}
  no-apparmor-param:
    exec: sh -c "! grep -q security=apparmor /etc/default/grub"
    exit-status: 0
    skip: false
