file:
  /etc/ssh/sshd_config:
    exists: true
    contains:
      - 'PermitRootLogin no'
      - 'PasswordAuthentication no'
      - 'X11Forwarding no'
      - 'MaxAuthTries 4'
  /etc/sudoers:
    exists: true
    mode: "0440"
  /etc/security/pwquality.conf:
    exists: true
    contains:
      - 'minlen = 14'
  /etc/login.defs:
    exists: true
    contains:
      - 'PASS_MAX_DAYS'
command:
  tmout-l2:
    exec: grep -q '^TMOUT=' /etc/profile.d/cis-tmout.sh
    exit-status: 0
    skip: '{{ .Env.ENABLE_L2 | default "true" | eq "1" | ternary "false" "true" }}'
  umask-l2:
    exec: grep -q 'umask 027' /etc/profile
    exit-status: 0
    skip: '{{ .Env.ENABLE_L2 | default "true" | eq "1" | ternary "false" "true" }}'
