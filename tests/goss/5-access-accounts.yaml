file:
  /etc/ssh/sshd_config:
    exists: true
    contents:
      - 'PermitRootLogin no'
      - 'PasswordAuthentication no'
      - 'X11Forwarding no'
      - 'MaxAuthTries 4'
  /etc/sudoers:
    exists: true
    mode: "0440"
  /etc/security/pwquality.conf:
    exists: true
    contents:
      - 'minlen = 14'
  /etc/login.defs:
    exists: true
    contents:
      - 'PASS_MAX_DAYS'
    # Skipped in containers: minimal images lack login.defs so the states skip.
    skip: {{ .Env.SKIP_KERNEL_CHECKS | default "false" }}
command:
  tmout-l2:
    exec: grep -q '^TMOUT=' /etc/profile.d/cis-tmout.sh
    exit-status: 0
    skip: {{ not (eq (.Env.ENABLE_L2 | default "0") "1") }}
  umask-l2:
    exec: grep -q 'umask 027' /etc/profile
    exit-status: 0
    skip: {{ not (eq (.Env.ENABLE_L2 | default "0") "1") }}
  ctrlaltdel-l2:
    exec: systemctl is-enabled ctrl-alt-del.target | grep -q masked
    exit-status: 0
    skip: {{ not (eq (.Env.ENABLE_L2 | default "0") "1") }}
