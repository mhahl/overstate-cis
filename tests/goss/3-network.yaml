file:
  /etc/sysctl.d/99-cis.conf:
    exists: true
    contents:
      - 'net.ipv4.tcp_syncookies = 1'
      - 'net.ipv4.conf.all.log_martians = 1'
      - 'net.ipv4.conf.all.rp_filter = 1'
  /etc/firewalld/firewalld.conf:
    exists: true
    contents:
      - 'FirewallBackend=nftables'
command:
  firewalld-default-zone:
    exec: firewall-cmd --get-default-zone
    exit-status: 0
    stdout:
      - public
    # Live-service check: firewall-cmd needs dbus/nftables. Config file above stays strict.
    skip: {{ .Env.SKIP_KERNEL_CHECKS | default "false" }}
  l2-drop-zone:
    exec: firewall-cmd --get-default-zone | grep -q drop
    exit-status: 0
    skip: {{ not (eq (.Env.ENABLE_L2 | default "0") "1") }}
